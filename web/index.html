<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapid Trigger Capture</title>
<style>body{font:16px system-ui;max-width:950px;margin:40px auto;padding:16px}button,input{padding:8px;margin:4px}pre{white-space:pre-wrap;background:#eee;padding:16px}</style>
<h1>Rapid Trigger Capture</h1>
<p>Raw vendor HID reports. Depth decoding requires a verified device profile.</p>
<button id="connect">Connect</button><button id="start" disabled>Start</button><button id="stop" disabled>Stop</button><button id="export" disabled>Export JSONL</button>
<p>Maximum reports: <input id="limit" type="number" value="500000" min="1" max="2000000"></p>
<p>Keep this window open while playing. Browser timestamps represent delivery time, not sensor sampling time.</p>
<pre id="status">Disconnected</pre>
<script type="module" src="capture.js"></script>
</html>
