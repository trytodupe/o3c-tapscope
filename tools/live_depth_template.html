<!doctype html>
<html lang="en"><meta charset="utf-8"><title>O3C live depth</title>
<style>
:root{--bg:#0b0f13;--ink:#e6edf3;--dim:#8b98a5;--grid:#1b2430;--accent:#7c5cff;
      --k0:#4c8dff;--k1:#f4a261;--k2:#31c48d}
*{box-sizing:border-box}
body{margin:0;padding:14px 18px 26px;background:var(--bg);color:var(--ink);
     font:14px/1.45 system-ui,"Segoe UI",sans-serif}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12.5px}
#status{color:var(--dim);font-size:12.5px;margin:2px 0 12px}
.keys{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.key{text-align:center}
.key canvas{display:block;border:1px solid #2b3440;background:#0b1016;border-radius:6px}
.key .name{margin-top:6px;font-weight:600}
.key .read{font:12.5px ui-monospace,Consolas,monospace;color:var(--dim)}
#hist{width:100%;height:170px;border:1px solid #2b3440;background:#0b1016;border-radius:6px;margin-top:16px}
.legend{color:var(--dim);font-size:12px;margin-top:6px}
.legend b{font-weight:600}
</style>
<h1>O3C live depth</h1>
<div class="sub">read-only 2 kHz poll &middot; depth in mm from the key top &middot; game-independent</div>
<div id="status">connecting…</div>
<div class="keys" id="keys"></div>
<canvas id="hist"></canvas>
<div class="legend" id="legend"></div>
<script>
const cfg = __CONFIG__;
const keys = cfg.keys;
const rtOf = key => (key.rt_range_mm || []).filter(value => value != null && value > 0);
const COLORS = ["#4c8dff", "#f4a261", "#31c48d"];
const axisMax = Math.max(1, ...keys.map(key => key.travel_mm || 0), ...keys.flatMap(rtOf));
const mmOf = (key, raw) => {
  const lut = key.lut_mm || [];
  if (!lut.length) return 0;
  return lut[Math.max(0, Math.min(lut.length - 1, Math.round(raw)))];
};
const BAR = {w: 124, h: 360};

const keysEl = document.getElementById("keys");
const views = keys.map((key, index) => {
  const wrap = document.createElement("div");
  wrap.className = "key";
  const canvas = document.createElement("canvas");
  canvas.width = BAR.w; canvas.height = BAR.h;
  const name = document.createElement("div");
  name.className = "name"; name.textContent = key.name;
  name.style.color = COLORS[index % COLORS.length];
  const read = document.createElement("div");
  read.className = "read"; read.textContent = "0.00 mm";
  wrap.append(canvas, name, read);
  keysEl.append(wrap);
  return {key, index, canvas, ctx: canvas.getContext("2d"), read};
});
document.getElementById("legend").innerHTML = "shaded band = RT range " + keys
  .map(key => `${key.name} ${rtOf(key).length ? rtOf(key).map(v => v.toFixed(2)).join(" – ") + " mm" : "(unset)"}`)
  .join(" · ");

function yOf(value) { return Math.max(0, Math.min(BAR.h, value / axisMax * BAR.h)); }

function drawKey(view, mm, raw) {
  const ctx = view.ctx;
  const color = COLORS[view.index % COLORS.length];
  const rt = rtOf(view.key);
  ctx.clearRect(0, 0, BAR.w, BAR.h);
  // RT band
  if (rt.length) {
    const yTop = yOf(Math.min(...rt)), yBot = yOf(Math.max(...rt));
    ctx.fillStyle = "rgba(124,92,255,0.08)";
    ctx.fillRect(0, yTop, BAR.w, yBot - yTop);
    ctx.strokeStyle = "#a99bff";
    ctx.setLineDash([5, 4]);
    for (const value of rt) {
      ctx.beginPath(); ctx.moveTo(0, yOf(value)); ctx.lineTo(BAR.w, yOf(value)); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  // grid + labels
  ctx.font = "10px ui-monospace,Consolas,monospace";
  ctx.textAlign = "left";
  for (let value = 0; value <= axisMax + 1e-9; value += 0.5) {
    const y = yOf(value);
    ctx.strokeStyle = Math.abs(value - Math.round(value)) < 1e-6 ? "#1b2430" : "#141c25";
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(BAR.w, y + 0.5); ctx.stroke();
    ctx.fillStyle = "#6b7683";
    ctx.fillText(value.toFixed(1), 4, y - 2);
  }
  // fill from the top down to the current depth
  const y = yOf(mm);
  const gradient = ctx.createLinearGradient(0, 0, 0, BAR.h);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, "rgba(11,16,22,0.15)");
  ctx.fillStyle = gradient;
  ctx.globalAlpha = 0.55;
  ctx.fillRect(0, 0, BAR.w, y);
  ctx.globalAlpha = 1;
  // current depth line (depth grows downward, like the key press)
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(BAR.w, y); ctx.stroke();
  ctx.fillStyle = "#e6edf3";
  ctx.textAlign = "right";
  ctx.fillText(mm.toFixed(2), BAR.w - 5, Math.max(11, Math.min(BAR.h - 3, y - 4)));
  ctx.textAlign = "left";
}

const history = [];
const HIST_MS = 3000;
const hist = document.getElementById("hist");
const histCtx = hist.getContext("2d");

function drawHistory() {
  const w = hist.clientWidth, h = hist.clientHeight;
  hist.width = w; hist.height = h;
  histCtx.clearRect(0, 0, w, h);
  const now = performance.now();
  const t0 = now - HIST_MS;
  const xOf = t => (t - t0) / HIST_MS * w;
  // depth from the key top grows downward, so 0 is at the top edge here too
  const yOf2 = value => value / axisMax * h;
  keys.forEach(key => {
    const rt = rtOf(key);
    if (!rt.length) return;
    histCtx.fillStyle = "rgba(124,92,255,0.08)";
    const yA = yOf2(Math.min(...rt)), yB = yOf2(Math.max(...rt));
    histCtx.fillRect(0, yA, w, yB - yA);
    histCtx.strokeStyle = "rgba(169,155,255,0.6)";
    histCtx.setLineDash([5, 4]);
    for (const value of rt) {
      histCtx.beginPath(); histCtx.moveTo(0, yOf2(value)); histCtx.lineTo(w, yOf2(value)); histCtx.stroke();
    }
    histCtx.setLineDash([]);
  });
  keys.forEach((key, index) => {
    histCtx.strokeStyle = COLORS[index % COLORS.length];
    histCtx.lineWidth = 1.4;
    histCtx.beginPath();
    history.forEach((point, i) => {
      const x = xOf(point.t), y = yOf2(point.mm[index]);
      if (i === 0) histCtx.moveTo(x, y); else histCtx.lineTo(x, y);
    });
    histCtx.stroke();
  });
}

let pending = null;
const source = new EventSource("/events");
source.onmessage = event => {
  const data = JSON.parse(event.data);
  const mm = keys.map((key, i) => mmOf(key, (data.levels || [])[i] || 0));
  document.getElementById("status").textContent =
    data.error ? `device: ${data.error}`
    : `${data.rate} Hz poll &middot; ${data.count} samples` .replace("&middot;", "·");
  views.forEach(view => {
    drawKey(view, mm[view.index], (data.levels || [])[view.index] || 0);
    view.read.textContent = `${mm[view.index].toFixed(2)} mm · raw ${(data.levels || [])[view.index] || 0}`;
  });
  history.push({t: performance.now(), mm});
  while (history.length && history[0].t < performance.now() - HIST_MS) history.shift();
  pending = true;
};
source.onerror = () => { document.getElementById("status").textContent = "stream closed — is the server still running?"; };

(function loop() {
  if (pending) { pending = false; drawHistory(); }
  requestAnimationFrame(loop);
})();
</script>
</html>
